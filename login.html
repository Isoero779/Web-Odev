<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">SAÜ Web Proje</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                        <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                        <li class="nav-item"><a class="nav-link" href="sehir.html">Şehrim</a></li>
                        <li class="nav-item"><a class="nav-link" href="miras.html">Mirasımız</a></li>
                        <li class="nav-item"><a class="nav-link" href="ilgi.html">İlgi Alanlarım</a></li>
                        <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                        <li class="nav-item"><a class="nav-link active" href="login.html">Giriş</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 mb-5 flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm w-100" style="max-width: 400px;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Öğrenci Girişi</h2>
                
                <div id="jsHata" class="alert alert-danger" style="display: none;"></div>
                <div id="phpHata" class="alert alert-danger" style="display: none;">Kullanıcı adı veya şifre hatalı! Lütfen tekrar deneyin.</div>

                <form id="loginForm" action="login_islem.php" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Kullanıcı Adı (E-posta)</label>
                        <input type="text" class="form-control" id="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="sifre" class="form-label">Şifre (Öğrenci No)</label>
                        <input type="password" class="form-control" id="sifre" name="sifre">
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="kontrolGiris()">Giriş Yap</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 Web Teknolojileri Projesi</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('hata')) {
            document.getElementById('phpHata').style.display = 'block';
        }

        function kontrolGiris() {
            const jsHata = document.getElementById('jsHata');
            const phpHata = document.getElementById('phpHata');
            
            jsHata.style.display = 'none';
            phpHata.style.display = 'none';
            jsHata.innerHTML = '';

            const email = document.getElementById('email').value.trim();
            const sifre = document.getElementById('sifre').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let hatalar = [];

            if (email === '' || sifre === '') {
                hatalar.push("- Kullanıcı adı ve şifre alanları boş bırakılamaz.");
            } else if (!emailRegex.test(email)) {
                hatalar.push("- Lütfen geçerli bir e-posta adresi formatı giriniz.");
            }

            if (hatalar.length > 0) {
                jsHata.innerHTML = hatalar.join("<br>");
                jsHata.style.display = 'block';
            } else {
                document.getElementById('loginForm').submit();
            }
        }
    </script>
</body>
</html>
