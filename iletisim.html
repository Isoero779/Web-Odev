<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Kişisel Web Sitem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">İsmetin Sitesi</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                        <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                        <li class="nav-item"><a class="nav-link" href="sehir.html">Şehrim</a></li>
                        <li class="nav-item"><a class="nav-link" href="miras.html">Mirasımız</a></li>
                        <li class="nav-item"><a class="nav-link" href="ilgi.html">İlgi Alanlarım</a></li>
                        <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Giriş</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 mb-5 flex-grow-1" id="app">
        <h1 class="mb-4 border-bottom pb-2">İletişim</h1>
        
        <div v-if="vueHata" class="alert alert-danger" v-html="vueHataMesaji"></div>
        <div id="nativeHata" class="alert alert-danger" style="display: none;"></div>

        <form id="iletisimFormu" action="islem.php" method="POST">
            <div class="mb-3">
                <label for="ad" class="form-label">Adınız Soyadınız</label>
                <input type="text" class="form-control" id="ad" name="ad" v-model="form.ad">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-posta Adresiniz</label>
                <input type="text" class="form-control" id="email" name="email" v-model="form.email">
            </div>

            <div class="mb-3">
                <label for="telefon" class="form-label">Telefon Numaranız</label>
                <input type="text" class="form-control" id="telefon" name="telefon" placeholder="05xxxxxxxxx" v-model="form.telefon">
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Cinsiyet</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="cinsiyet" id="erkek" value="Erkek" v-model="form.cinsiyet">
                    <label class="form-check-label" for="erkek">Erkek</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="cinsiyet" id="kadin" value="Kadın" v-model="form.cinsiyet">
                    <label class="form-check-label" for="kadin">Kadın</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="konu" class="form-label">İletişim Konusu</label>
                <select class="form-select" id="konu" name="konu" v-model="form.konu">
                    <option value="">Lütfen seçiniz...</option>
                    <option value="İş Teklifi">İş Teklifi</option>
                    <option value="Soru/Görüş">Soru/Görüş</option>
                    <option value="Hata Bildirimi">Hata Bildirimi</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mesaj" class="form-label">Mesajınız</label>
                <textarea class="form-control" id="mesaj" name="mesaj" rows="5" v-model="form.mesaj"></textarea>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="onay" name="onay" v-model="form.onay">
                <label class="form-check-label" for="onay">Bilgilerimin doğruluğunu onaylıyorum.</label>
            </div>

            <div class="d-flex gap-3">
                <button type="button" class="btn btn-primary" onclick="kontrolNative()">Gönder (Native JS)</button>
                <button type="button" class="btn btn-success" @click="kontrolVue">Gönder (Vue.js)</button>
                <button type="reset" class="btn btn-secondary">Temizle</button>
            </div>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 Web Teknolojileri Projesi</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function kontrolNative() {
            const hataKutusu = document.getElementById('nativeHata');
            hataKutusu.style.display = 'none';
            hataKutusu.innerHTML = '';

            const ad = document.getElementById('ad').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefon = document.getElementById('telefon').value.trim();
            const konu = document.getElementById('konu').value;
            const mesaj = document.getElementById('mesaj').value.trim();
            const onay = document.getElementById('onay').checked;

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const telefonRegex = /^[0-9]{10,11}$/;

            let hatalar = [];

            if (ad === '') hatalar.push("- Ad Soyad alanı boş bırakılamaz.");
            
            if (email === '') {
                hatalar.push("- E-posta alanı boş bırakılamaz.");
            } else if (!emailRegex.test(email)) {
                hatalar.push("- Geçerli bir e-posta adresi formatı giriniz.");
            }
            
            if (telefon === '') {
                hatalar.push("- Telefon alanı boş bırakılamaz.");
            } else if (!telefonRegex.test(telefon)) {
                hatalar.push("- Telefon sadece rakamlardan oluşmalı ve 10-11 haneli olmalıdır.");
            }
            
            if (konu === '') hatalar.push("- Lütfen bir konu seçiniz.");
            if (mesaj === '') hatalar.push("- Mesaj alanı boş bırakılamaz.");
            if (!onay) hatalar.push("- Bilgilerin doğruluğunu onaylamanız gerekmektedir.");

            if (hatalar.length > 0) {
                hataKutusu.innerHTML = "<strong>Native JS Kontrol Hatası:</strong><br>" + hatalar.join("<br>");
                hataKutusu.style.display = 'block';
            } else {
                document.getElementById('iletisimFormu').submit();
            }
        }

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    form: {
                        ad: '',
                        email: '',
                        telefon: '',
                        cinsiyet: 'Erkek',
                        konu: '',
                        mesaj: '',
                        onay: false
                    },
                    vueHata: false,
                    vueHataMesaji: ''
                }
            },
            methods: {
                kontrolVue() {
                    this.vueHata = false;
                    this.vueHataMesaji = '';
                    let hatalar = [];

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    const telefonRegex = /^[0-9]{10,11}$/;

                    if (!this.form.ad.trim()) hatalar.push("- Ad Soyad alanı boş bırakılamaz.");
                    
                    if (!this.form.email.trim()) {
                        hatalar.push("- E-posta alanı boş bırakılamaz.");
                    } else if (!emailRegex.test(this.form.email)) {
                        hatalar.push("- Geçerli bir e-posta adresi formatı giriniz.");
                    }
                    
                    if (!this.form.telefon.trim()) {
                        hatalar.push("- Telefon alanı boş bırakılamaz.");
                    } else if (!telefonRegex.test(this.form.telefon)) {
                        hatalar.push("- Telefon sadece rakamlardan oluşmalı ve 10-11 haneli olmalıdır.");
                    }
                    
                    if (!this.form.konu) hatalar.push("- Lütfen bir konu seçiniz.");
                    if (!this.form.mesaj.trim()) hatalar.push("- Mesaj alanı boş bırakılamaz.");
                    if (!this.form.onay) hatalar.push("- Bilgilerin doğruluğunu onaylamanız gerekmektedir.");

                    if (hatalar.length > 0) {
                        this.vueHataMesaji = "<strong>Vue.js Kontrol Hatası:</strong><br>" + hatalar.join("<br>");
                        this.vueHata = true;
                    } else {
                        document.getElementById('iletisimFormu').submit();
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
